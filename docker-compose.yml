services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - .:/code
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: timescaledb
    shm_size: 1gb
    environment:
      POSTGRES_DB: jejak_db
      POSTGRES_USER: jejak_user
      POSTGRES_PASSWORD: jejak_dev_password
      PGDATA: /home/postgres/pgdata/data
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U jejak_user -d jejak_db && psql -U jejak_user -d jejak_db -c 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: nginx:alpine
    env_file:
      - secrets.dev.env
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/local:/etc/nginx/templates/
      - ./static:/code/static
    depends_on:
      - app
    restart: unless-stopped

  app: &app
    build:
      context: .
      args:
        - ENVIRONMENT=dev
    env_file:
      - secrets.dev.env
    command: bash run_app.sh
    volumes:
      - .:/code
      - ./../.firebase/rosak-7223b-firebase-adminsdk-8hcki-f2e0ee7994.json:/google-application-credential.json
    expose:
      - "8001"
    depends_on:
      - db
      - redis
      - timescaledb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  celeryworker:
    <<: *app
    depends_on:
      - db
      - redis
      - timescaledb
    command: bash run_celery.sh

  celerybeat:
    <<: *app
    volumes:
      - .:/code
    env_file:
      - secrets.dev.env
    depends_on:
      - redis
      - db
      - timescaledb
    ports: []
    command: bash run_celery_beat.sh

volumes:
  timescaledb_data:
